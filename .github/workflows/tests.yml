name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tkinter
        run: sudo apt-get update && sudo apt-get install --yes python3-tk

      - name: Run unit tests
        run: python3 -m unittest discover -s src -p "test*.py"
